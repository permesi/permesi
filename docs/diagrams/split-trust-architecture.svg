<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 490" width="1140" height="490" role="img" aria-label="Permesi Split-Trust Architecture">
  <title>Permesi Split-Trust Architecture</title>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 11.5px; font-weight: 400; fill: #475569; }
      .zone-title { font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
      .node-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .node-body { font-size: 11px; font-weight: 400; fill: #334155; }
      .edge-label { font-size: 10.5px; font-weight: 500; fill: #334155; }
      .phase-label { font-size: 11px; font-weight: 700; fill: #1e40af; }
      .seq-head { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .seq-msg { font-size: 11px; font-weight: 500; fill: #1e293b; }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#047857"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1140" height="490" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="32" class="title">Permesi Split-Trust Architecture</text>
  <text x="24" y="50" class="subtitle">Edge admission (genesis) is decoupled from core IAM (permesi) via local PASETO / PASERK verification</text>
  <rect x="24" y="68" width="220" height="396" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="38" y="90" class="zone-title" fill="#475569">UNTRUSTED INTERNET</text>
  <rect x="284" y="68" width="230" height="178" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="298" y="90" class="zone-title" fill="#b45309">EDGE TRUST BOUNDARY</text>
  <rect x="284" y="274" width="230" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="298" y="296" class="zone-title" fill="#1d4ed8">CORE IAM TRUST BOUNDARY</text>
  <rect x="790" y="68" width="326" height="396" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="804" y="90" class="zone-title" fill="#047857">DATA &amp; CRYPTOGRAPHY PLANE</text>
  <rect x="42" y="114" width="184" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134.0" y="141.5" text-anchor="middle" class="node-title">Browser / Web Console</text>
  <text x="134.0" y="158.5" text-anchor="middle" class="node-body">Leptos CSR (static WASM)</text>
  <text x="134.0" y="173.5" text-anchor="middle" class="node-body">OPAQUE, Passkeys, MFA,</text>
  <text x="134.0" y="188.5" text-anchor="middle" class="node-body">Org &amp; OAuth Console</text>
  <rect x="42" y="316" width="184" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134.0" y="343.5" text-anchor="middle" class="node-title">OAuth / OIDC Client</text>
  <text x="134.0" y="360.5" text-anchor="middle" class="node-body">Public or Confidential</text>
  <text x="134.0" y="375.5" text-anchor="middle" class="node-body">Authorization Code + S256</text>
  <text x="134.0" y="390.5" text-anchor="middle" class="node-body">Resource API verification</text>
  <rect x="302" y="108" width="194" height="116" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="399.0" y="140.0" text-anchor="middle" class="node-title">genesis</text>
  <text x="399.0" y="157.0" text-anchor="middle" class="node-body">Edge Admission Token Mint</text>
  <text x="399.0" y="172.0" text-anchor="middle" class="node-body">GET /token?client_id=...</text>
  <text x="399.0" y="187.0" text-anchor="middle" class="node-body">GET /paserk.json</text>
  <text x="399.0" y="202.0" text-anchor="middle" class="node-body">Stateless · PASETO v4.public</text>
  <rect x="302" y="312" width="194" height="134" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="399.0" y="345.5" text-anchor="middle" class="node-title">permesi (Replicas)</text>
  <text x="399.0" y="362.5" text-anchor="middle" class="node-body">Core IAM &amp; OIDC Authority</text>
  <text x="399.0" y="377.5" text-anchor="middle" class="node-body">Local PASERK verify</text>
  <text x="399.0" y="392.5" text-anchor="middle" class="node-body">OPAQUE · WebAuthn · MFA</text>
  <text x="399.0" y="407.5" text-anchor="middle" class="node-body">Tenants · /authorize · /token</text>
  <text x="399.0" y="422.5" text-anchor="middle" class="node-body">/userinfo · /revoke · /jwks.json</text>
  <rect x="544" y="192" width="196" height="128" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="642.0" y="222.5" text-anchor="middle" class="node-title">Local PASERK Verify</text>
  <text x="642.0" y="239.5" text-anchor="middle" class="node-body">Inline JSON = fully offline.</text>
  <text x="642.0" y="254.5" text-anchor="middle" class="node-body">URL mode: refresh /paserk.json</text>
  <text x="642.0" y="269.5" text-anchor="middle" class="node-body">on startup, stale TTL (incl.</text>
  <text x="642.0" y="284.5" text-anchor="middle" class="node-body">/ready &amp; /health -&gt; 503 if</text>
  <text x="642.0" y="299.5" text-anchor="middle" class="node-body">unreachable), or unknown kid.</text>
  <rect x="812" y="104" width="282" height="134" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="953.0" y="137.5" text-anchor="middle" class="node-title">OpenBao 2.7</text>
  <text x="953.0" y="154.5" text-anchor="middle" class="node-body">AppRole · Agent socket · K8s auth</text>
  <text x="953.0" y="169.5" text-anchor="middle" class="node-body">Transit Ed25519 (genesis-signing)</text>
  <text x="953.0" y="184.5" text-anchor="middle" class="node-body">Transit ChaCha20 (totp) · RSA-2048 (oidc)</text>
  <text x="953.0" y="199.5" text-anchor="middle" class="node-body">KV v2 (OPAQUE seed, MFA pepper)</text>
  <text x="953.0" y="214.5" text-anchor="middle" class="node-body">Dynamic Postgres creds · Internal PKI</text>
  <path d="M 812 277 L 812 429 A 141.0 11 0 0 0 1094 429 L 1094 277 Z" fill="#d1fae5" stroke="#047857" stroke-width="1.5" filter="url(#shadow)"/>
  <ellipse cx="953.0" cy="277" rx="141.0" ry="11" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="953.0" y="322.5" text-anchor="middle" class="node-title">PostgreSQL 19</text>
  <text x="953.0" y="339.5" text-anchor="middle" class="node-body">genesis DB: clients, partitioned tokens</text>
  <text x="953.0" y="354.5" text-anchor="middle" class="node-body">permesi DB: users, sessions, sealed</text>
  <text x="953.0" y="369.5" text-anchor="middle" class="node-body">OPAQUE/WebAuthn exchanges, tenants,</text>
  <text x="953.0" y="384.5" text-anchor="middle" class="node-body">OAuth grants, hashed codes, refresh</text>
  <text x="953.0" y="399.5" text-anchor="middle" class="node-body">families &amp; issuance receipts</text>
  <path d="M 226 144 L 302 144" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <rect x="206.6" y="117.0" width="114.8" height="22.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="264.0" y="130.0" text-anchor="middle" class="edge-label" fill="#b45309">1. Request token</text>
  <path d="M 302 178 L 226 178" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <rect x="228.7" y="185.0" width="70.7" height="22.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="264.0" y="198.0" text-anchor="middle" class="edge-label" fill="#b45309">2. PASETO</text>
  <path d="M 134 206 L 134 252 L 266 252 L 266 340 L 302 340" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <rect x="110.2" y="234.0" width="171.5" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="196.0" y="247.0" text-anchor="middle" class="edge-label" fill="#1d4ed8">3. Auth POST + Zero Token</text>
  <text x="196.0" y="261.0" text-anchor="middle" class="edge-label" fill="#1d4ed8">or Session Cookie</text>
  <path d="M 226 382 L 302 382" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <rect x="219.2" y="394.0" width="89.6" height="36.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="264.0" y="407.0" text-anchor="middle" class="edge-label" fill="#1d4ed8">OAuth / OIDC</text>
  <text x="264.0" y="421.0" text-anchor="middle" class="edge-label" fill="#1d4ed8">&amp; /jwks.json</text>
  <path d="M 496 342 L 528 342 L 528 256 L 544 256" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <path d="M 544 226 L 528 226 L 528 166 L 496 166" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <path d="M 496 138 L 812 138" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
  <rect x="524.1" y="111.0" width="259.7" height="22.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="654.0" y="124.0" text-anchor="middle" class="edge-label" fill="#047857">Transit Ed25519 sign &amp; dynamic DB creds</text>
  <path d="M 496 162 L 774 162 L 774 320 L 812 320" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
  <rect x="562.0" y="151.0" width="184.1" height="22.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="654.0" y="164.0" text-anchor="middle" class="edge-label" fill="#047857">Audit jti (genesis_runtime)</text>
  <path d="M 496 364 L 756 364 L 756 188 L 812 188" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
  <rect x="527.9" y="333.0" width="228.2" height="22.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="642.0" y="346.0" text-anchor="middle" class="edge-label" fill="#047857">Transit RSA/TOTP, KV v2 &amp; DB creds</text>
  <path d="M 496 404 L 812 404" fill="none" stroke="#047857" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
  <rect x="514.7" y="413.0" width="278.6" height="22.0" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="654.0" y="426.0" text-anchor="middle" class="edge-label" fill="#047857">Shared state &amp; row locks (permesi_runtime)</text>
</svg>
