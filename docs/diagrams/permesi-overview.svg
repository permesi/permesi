<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1680" height="1156" viewBox="0 0 1680 1156" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">How Permesi works — admission and identity architecture</title>
<desc id="svgdesc">A two-step admission flow for selected authentication endpoints: the client requests a short-lived pass from Genesis through CDN/WAF protection, then sends a separate request with that pass to Permesi. Other public OAuth and OIDC endpoints have their own controls. Genesis can run in multiple regions and Permesi in multiple core replicas. Current Genesis token issuance performs a PostgreSQL client lookup and token insert, then calls OpenBao Transit to sign. These remain shared capacity dependencies.</desc>
