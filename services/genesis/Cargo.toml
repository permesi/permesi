[package]
name = "genesis"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true
description = "Token Zero generator for permesi"
documentation = "https://github.com/permesi/genesis/blob/main/README.md"
repository = "https://github.com/permesi/genesis"
readme = "../../README.md"
keywords = ["password", "security", "token"]
categories = ["web-programming::http-server"]
license.workspace = true
build = "build.rs"

[[bin]]
name = "genesis-openapi"
path = "src/bin/openapi.rs"

[package.metadata.deb]
maintainer = "Team Permesi <team@permesi.dev>"
license-file = ["../../LICENSE"]
section = "net"
priority = "optional"
maintainer-scripts = "../../contrib/debian/genesis"
assets = [
    ["target/release/genesis", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/genesis/README.md", "644"],
    ["../../contrib/systemd/genesis.service", "lib/systemd/system/genesis.service", "644"],
    ["../../contrib/systemd/genesis.env.example", "usr/share/doc/genesis/genesis.env.example", "644"],
]

[package.metadata.generate-rpm]
summary = "Genesis service"
vendor = "Team Permesi <team@permesi.dev>"
url = "https://permesi.dev"
# gzip keeps the package installable on the oldest supported RPM distributions.
payload_compress = "gzip"
post_install_script = "../../contrib/rpm/genesis/post.sh"
pre_uninstall_script = "../../contrib/rpm/genesis/preun.sh"
post_uninstall_script = "../../contrib/rpm/genesis/postun.sh"
assets = [
    { source = "../../target/release/genesis", dest = "/usr/bin/genesis", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/genesis/README.md", mode = "644", doc = true },
    { source = "../../contrib/systemd/genesis.service", dest = "/usr/lib/systemd/system/genesis.service", mode = "644" },
    { source = "../../contrib/systemd/genesis.env.example", dest = "/usr/share/doc/genesis/genesis.env.example", mode = "644", doc = true },
]

[lints]
workspace = true

# OTLP trace export is a compile-time capability: the default build keeps local
# structured logging only and does not compile the OpenTelemetry/tonic stack.
# Release images, packages, and the dev stack build with `--features telemetry`;
# such a binary exports spans only when OTEL_EXPORTER_OTLP_ENDPOINT is set at startup.
[features]
default = []
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
    "dep:tracing-opentelemetry",
]

[dependencies]
admission_token = { workspace = true }
vault_client = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, features = ["tracing"] }
axum-server = { workspace = true }
chrono = "0.4"
clap = { workspace = true, features = ["env"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }
hyperlocal = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, features = ["tls-roots", "tls-ring"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"], optional = true }
rand = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "ipnetwork",
    "uuid",
] }
temp-env = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = [
    "trace",
    "cors",
    "request-id",
    "set-header",
] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
tonic = { workspace = true, features = ["tls-native-roots"], optional = true }
ulid = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["v1", "v4", "v7"] }
service_utils = { workspace = true }

[build-dependencies]
built = { workspace = true, features = ["git2"] }
git2.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["full"] }
rcgen = { workspace = true }
test_support = { workspace = true }
wiremock = "0.6"
