[package]
name = "permesi"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true
description = "Identity and Access Management"
documentation = "https://github.com/permesi/permesi/blob/main/README.md"
homepage = "https://permesi.dev"
repository = "https://github.com/permesi/permesi"
readme = "../../README.md"
keywords = ["password", "security", "iam", "identity", "access"]
categories = ["web-programming::http-server"]
license.workspace = true
build = "build.rs"

[[bin]]
name = "permesi-openapi"
path = "src/bin/openapi.rs"

[package.metadata.deb]
maintainer = "Team Permesi <team@permesi.dev>"
license-file = ["../../LICENSE"]
section = "net"
priority = "optional"
maintainer-scripts = "../../contrib/debian/permesi"
assets = [
    ["target/release/permesi", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/permesi/README.md", "644"],
    ["../../contrib/systemd/permesi.service", "lib/systemd/system/permesi.service", "644"],
    ["../../contrib/systemd/permesi.env.example", "usr/share/doc/permesi/permesi.env.example", "644"],
]

[lints]
workspace = true

# OTLP trace export is a compile-time capability: the default build keeps local
# structured logging only and does not compile the OpenTelemetry/tonic stack.
# Release images, packages, and the dev stack build with `--features telemetry`;
# such a binary exports spans only when OTEL_EXPORTER_OTLP_ENDPOINT is set at startup.
[features]
default = []
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
    "dep:tracing-opentelemetry",
]

[dependencies]
admission_token = { workspace = true }
vault_client = { workspace = true }
argon2 = { workspace = true }
anyhow = { workspace = true }
axum = { version = "0.8", features = ["macros", "tracing"] }
axum-server = { workspace = true }
base64 = { workspace = true }
base64ct = { version = "1.8.3", features = ["alloc"] }
clap = { workspace = true, features = ["env"] }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
opaque-ke = { workspace = true }
opaque_argon2 = { workspace = true }
opaque_rand_chacha = { workspace = true }
opaque_rand_core = { workspace = true }
opaque_sha2 = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, features = ["tls-roots", "tls-ring"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"], optional = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
regex = "1.13"
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
totp-rs = { version = "6.0", features = ["qr", "gen_secret"] }
chrono = { workspace = true }
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "ipnetwork",
    "uuid",
    "chrono",
] }
temp-env = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tonic = { workspace = true, features = ["tls-native-roots"], optional = true }
tower = { workspace = true }
tower-http = { workspace = true, features = [
    "trace",
    "propagate-header",
    "set-header",
    "cors",
    "request-id",
] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
ulid = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["v1", "v4", "v7"] }
chacha20poly1305 = "0.11.0"
# webauthn-rs 0.6 uses RustCrypto (via crypto-glue) instead of OpenSSL, which keeps
# the whole workspace OpenSSL-free. Credentials serialized by 0.5 load unchanged.
webauthn-rs = { version = "0.6.1-dev", features = ["conditional-ui", "danger-allow-state-serialisation"] }
hex = "0.4"
hmac = { workspace = true }
service_utils = { workspace = true }

[dev-dependencies]
base32 = "0.5.1"
http-body-util.workspace = true
hyper = { workspace = true }
hyper-util.workspace = true
rcgen = { workspace = true }
test_support = { workspace = true }
wiremock = "0.6"

[build-dependencies]
built = { workspace = true, features = ["git2"] }
