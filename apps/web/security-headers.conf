# Static hosting security headers. Included at the server level and re-included
# inside every location that declares its own `add_header` directives, because
# nginx drops inherited `add_header` directives from a location as soon as that
# location declares any of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
