[package]
name = "permesi_web"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
build = "build.rs"
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[build-dependencies]
built = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
lucide-leptos = { version = "3.63", default-features = false, features = ["account", "arrows", "development", "devices", "files", "layout", "navigation", "notifications", "security", "text", "time"] }
leptos_dom = { version = "0.8" }
gloo-net = { version = "0.7", features = ["json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
base64 = { workspace = true }
opaque-ke = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
argon2 = { workspace = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
sha2 = "0.11"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.107", features = ["AbortController", "AbortSignal", "Clipboard", "HtmlDialogElement", "History", "Location", "Storage", "UrlSearchParams", "Window", "CredentialsContainer", "PublicKeyCredential", "AuthenticatorAttestationResponse", "AuthenticatorAssertionResponse", "PublicKeyCredentialCreationOptions", "PublicKeyCredentialRequestOptions", "PublicKeyCredentialDescriptor", "PublicKeyCredentialUserEntity", "PublicKeyCredentialRpEntity", "PublicKeyCredentialParameters", "AuthenticatorSelectionCriteria", "PublicKeyCredentialType", "AuthenticatorTransport", "Navigator", "CredentialCreationOptions", "CredentialRequestOptions"] }
