# Local HTTPS termination for Permesi services (DevPod split model).
#
# The app (genesis/permesi/web) runs in a separate DevPod container that joins this
# `permesi` network as `app` AFTER HAProxy has started. So HAProxy cannot resolve
# `app` at boot — it uses a `resolvers` section (reading the container's DNS via
# parse-resolv-conf) plus `init-addr last,none` to start anyway and re-resolve the
# `app` backend once it appears. The frontend cert and backend CA are issued from the
# dev Vault PKI / mkcert by `just devpod-bootstrap` inside the app container.

global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client  60s
  timeout server  60s

# Re-resolve backend hostnames at runtime using the container's configured DNS
# (podman aardvark / docker embedded DNS), so `app` is picked up once it joins.
resolvers podman
  parse-resolv-conf
  hold valid 5s
  hold nx 1s
  hold timeout 1s
  hold refused 1s
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s

frontend https_in
  bind :::8080 ssl crt /usr/local/etc/haproxy/certs/permesi.localhost.pem alpn http/1.1 v4v6
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port %[dst_port]
  http-request set-header X-Forwarded-Host %[req.hdr(host)]

  acl host_permesi hdr_beg(host) -i permesi.localhost
  acl host_api hdr_beg(host) -i api.permesi.localhost
  acl host_genesis hdr_beg(host) -i genesis.permesi.localhost

  use_backend permesi_web if host_permesi
  use_backend permesi_api if host_api
  use_backend genesis_api if host_genesis
  default_backend invalid_host

backend permesi_web
  http-request set-header Host permesi.localhost
  server permesi_web app:8081 check resolvers podman init-addr last,none

backend permesi_api
  http-request set-header Host api.permesi.localhost
  server permesi_api app:8001 ssl verify required ca-file /usr/local/etc/haproxy/clientca/permesi/ca.pem sni str(api.permesi.localhost) verifyhost api.permesi.localhost check resolvers podman init-addr last,none

backend genesis_api
  http-request set-header Host genesis.permesi.localhost
  server genesis_api app:8000 ssl verify required ca-file /usr/local/etc/haproxy/clientca/permesi/ca.pem sni str(genesis.permesi.localhost) verifyhost genesis.permesi.localhost check resolvers podman init-addr last,none

backend invalid_host
  http-request return status 404 content-type text/plain lf-string "Unknown host."
