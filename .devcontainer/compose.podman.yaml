# Local override for rootless Podman (merged on top of compose.yaml by the local
# devcontainer.json). Maps the container user to the host user so the bind-mounted
# workspace stays editable as `vscode` without subuid ownership skew. Not used on the
# remote (docker) flow, where keep-id is unnecessary and unsupported.

services:
  app:
    userns_mode: keep-id
