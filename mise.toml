# Project toolchain for the host dev flow (`just start`), the same on Linux and
# macOS: run `mise install`, then `just doctor`. Keep personal tools in your own
# ~/.config/mise/config.toml. System packages stay outside mise: zsh (the justfile
# shell), podman (rootless), jq, curl, and tmux only as the fallback when herdr is
# not available.

[settings]
cargo.binstall = true

[tools]
cargo-binstall = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-watch" = "latest"
direnv = "latest"
herdr = "latest"
just = "latest"
mkcert = "latest"
node = "lts"
ripgrep = "latest"
rust = "stable"
terraform = "1.15"
uv = "latest"
vault = "latest"
xh = "latest"
