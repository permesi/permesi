---
name: Release

# Run manually on `develop` (`just release`). The commit is the one Test & Build already
# passed on develop; this workflow bumps and commits nothing. It builds that commit once
# (binaries and packages, the signed production web build, the three images pushed under
# `:sha-<commit>`), publishes the GitHub release (which creates the tag), then tags the
# tested image digests, deploys the web build to Cloudflare Pages, dispatches Helm and
# publishes the API docs. `main` is protected with a push allow-list that only holds the
# operator, so `just release` fast-forwards `main` itself once this run has succeeded and
# develop's own Test & Build has finished (a pending `CI OK` blocks protected-branch
# updates). A failed job is fixed with "Re-run failed jobs"; nothing is published before
# every build job has succeeded.
on:
  workflow_dispatch:

# One release at a time; a second dispatch waits instead of replacing or cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

# Read-only by default; jobs that publish ask for more.
permissions:
  contents: read

jobs:
  # Everything that can be known before building: the branch, the version, that no
  # release of it exists, that the commit passed Test & Build, and that the committed
  # OpenAPI specs already carry the version (the bump touches Cargo.toml, Cargo.lock and
  # both specs' info.version).
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # `stable` moves every few weeks and "Re-run failed jobs" can run a leg hours later, so
      # it is resolved once here: every Rust job of this run installs exactly this version,
      # and a re-run keeps this job's output. Nothing in the repository has to be bumped.
      - name: Resolve the Rust toolchain for this run
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          version="$(rustc +stable --version | awk '{print $2}')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve stable to an exact version (got '${version}')."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "This release is built with Rust ${version}."

      - name: Check the commit can be released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/develop ]]; then
            echo "::error::Run the release on develop (got ${GITHUB_REF})."
            exit 1
          fi
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml has no X.Y.Z workspace version (found '${version}')."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::${version} is already tagged; bump the version on develop first."
            exit 1
          fi
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [[ -n "${latest}" && "$(printf '%s\n%s\n' "${latest}" "${version}" | sort -V | tail -n 1)" != "${version}" ]]; then
            echo "::error::${version} is below the latest release ${latest}; bump to a higher version."
            exit 1
          fi
          for spec in docs/openapi/permesi.json docs/openapi/genesis.json; do
            found="$(jq -r .info.version "${spec}")"
            if [[ "${found}" != "${version}" ]]; then
              echo "::error::${spec} is for ${found}, not ${version}; run just openapi and commit it with the bump."
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor origin/main "${GITHUB_SHA}"; then
            echo "::error::main has commits that develop does not; merge main into develop first."
            exit 1
          fi
          # `CI OK` is Test & Build's aggregate of every gating job; it must have
          # succeeded on exactly this commit.
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20OK&status=completed" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [[ "${passed}" -lt 1 ]]; then
            echo "::error::${GITHUB_SHA} has no successful CI OK check; wait for Test & Build to pass on develop."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} from ${GITHUB_SHA} (CI OK passed)."

  # One leg per CPU, each on a native runner: the musl archives, the Debian package and the
  # RPM package of that architecture. Keep the release's expected file set in step with this matrix.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TARGET: ${{ matrix.target }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      RPM_ARCH: ${{ matrix.rpm_arch }}
      # Native musl compiler for crates that build C code, on either architecture.
      CC_aarch64_unknown_linux_musl: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ needs.guard.outputs.rust }}
          targets: ${{ env.TARGET }}

      - uses: ./.github/actions/ensure-musl-toolchain
        timeout-minutes: 5

      - name: Build
        run: cargo build --release --locked --target "${TARGET}" -p permesi -p genesis --features permesi/telemetry,genesis/telemetry

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for binary_name in permesi genesis; do
            dirname="${binary_name}-${VERSION}-${TARGET}"
            mkdir "$dirname"
            mv "target/${TARGET}/release/$binary_name" "$dirname"
            tar -czf "dist/$dirname.tar.gz" "$dirname"
          done

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb --version 3.8.0

      # cargo-deb names the package after the runner's architecture, which is the target's.
      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p permesi -p genesis --features permesi/telemetry,genesis/telemetry
          cargo deb -p permesi --no-build
          cargo deb -p genesis --no-build
          for binary_name in permesi genesis; do
            deb="$(ls target/debian/${binary_name}_*.deb)"
            actual="$(dpkg-deb --field "${deb}" Architecture)"
            if [[ "${actual}" != "${DEB_ARCH}" ]]; then
              echo "::error::${deb} is for ${actual}, expected ${DEB_ARCH}."
              exit 1
            fi
            mv "${deb}" "dist/${binary_name}_${VERSION}_${DEB_ARCH}.deb"
          done
          ls -al dist

      - name: Install RPM packaging tools
        run: sudo apt-get install -y rpm

      - name: Install cargo-generate-rpm
        run: cargo install --locked cargo-generate-rpm --version 0.21.1

      # The release binaries were built above for the runner's architecture, which is the
      # target's; cargo-generate-rpm names the package after that architecture too.
      - name: Build RPM packages
        shell: bash
        run: |
          set -euo pipefail
          for binary_name in permesi genesis; do
            cargo generate-rpm -p "services/${binary_name}"
            rpm_file="$(ls "target/generate-rpm/${binary_name}"-*.rpm)"
            actual="$(rpm -qp --queryformat '%{ARCH}' "${rpm_file}")"
            if [[ "${actual}" != "${RPM_ARCH}" ]]; then
              echo "::error::${rpm_file} is for ${actual}, expected ${RPM_ARCH}."
              exit 1
            fi
            mv "${rpm_file}" "dist/${binary_name}-${VERSION}-1.${RPM_ARCH}.rpm"
          done
          ls -al dist

      # The release publishes exactly these files, downloaded from this run.
      - name: Upload the binaries and packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: guard
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ needs.guard.outputs.rust }}
          targets: wasm32-unknown-unknown

      # No build cache in the release workflow: what is built here ships, so it is built
      # from source only, never from a cache another run could have written.
      - name: Install Trunk
        run: ./scripts/install-trunk

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      # A release is built for production (permesi.com).
      - name: Set Frontend Env
        shell: bash
        env:
          PERMESI_CLIENT_ID: ${{ vars.PERMESI_CLIENT_ID }}
          PERMESI_API_BASE_URL: ${{ vars.PERMESI_API_BASE_URL }}
          PERMESI_TOKEN_BASE_URL: ${{ vars.PERMESI_TOKEN_BASE_URL }}
          PERMESI_OPAQUE_SERVER_ID: ${{ vars.PERMESI_OPAQUE_SERVER_ID }}
        run: |
          domain="permesi.com"
          api_base="${PERMESI_API_BASE_URL:-https://api.${domain}}"
          token_base="${PERMESI_TOKEN_BASE_URL:-https://genesis.${domain}}"
          opaque_id="${PERMESI_OPAQUE_SERVER_ID:-api.${domain}}"
          client_id="${PERMESI_CLIENT_ID:-00000000-0000-0000-0000-000000000000}"
          {
            echo "PERMESI_API_BASE_URL=${api_base}"
            echo "PERMESI_TOKEN_BASE_URL=${token_base}"
            echo "PERMESI_OPAQUE_SERVER_ID=${opaque_id}"
            echo "PERMESI_CLIENT_ID=${client_id}"
          } >> "$GITHUB_ENV"

      - name: Build CSS
        working-directory: apps/web
        run: npm run css:build

      - name: Clean Frontend Target
        run: cargo clean -p permesi_web --target wasm32-unknown-unknown

      - name: Build Frontend
        working-directory: apps/web
        run: trunk build --release

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: apps/web/dist
          if-no-files-found: error

  # Sign the production web build once (checksums, cosign, build provenance); the release
  # deploys this signed build to Cloudflare Pages and attaches it to the GitHub release.
  frontend-sign:
    name: Sign Frontend
    needs: [guard, frontend-build]
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      runner: ubuntu-latest
      deploy: false
    secrets: inherit

  web-dist:
    name: Package Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard, frontend-sign]
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Download the signed web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist-signed
          path: dist

      - name: Package it
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir out
          tar -czf "out/permesi-web-dist-${VERSION}.tar.gz" dist
          ls -al out

      - name: Upload the web build package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-web
          path: out/*
          if-no-files-found: error

  # Build the images once and push them only under a commit tag; the release adds its
  # version tags to exactly these digests.
  images:
    name: Build Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [guard, build, frontend-build]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      permesi_digest: ${{ steps.push.outputs.permesi_digest }}
      genesis_digest: ${{ steps.push.outputs.genesis_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/ensure-container-runtime

      - name: Login to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${TOKEN}" | ${CONTAINER_TOOL} login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Download Frontend Dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: apps/web/dist

      - name: Verify Frontend Dist layout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d apps/web/dist/dist && ! -f apps/web/dist/index.html ]]; then
            shopt -s dotglob
            mv apps/web/dist/dist/* apps/web/dist/
            rmdir apps/web/dist/dist
          fi
          test -f apps/web/dist/index.html

      - name: Download the x86_64 binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-binaries-x86_64-unknown-linux-musl
          path: dist

      # The images carry the very binaries the release archives publish, so one compiler
      # build backs the tarballs, the packages and the containers.
      - name: Extract the image binaries
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-musl
          mkdir -p dist-bin
          for binary_name in permesi genesis; do
            dirname="${binary_name}-${VERSION}-${target}"
            tar -xzf "dist/${dirname}.tar.gz" -C dist-bin --strip-components=1 "${dirname}/${binary_name}"
          done
          test -s dist-bin/permesi && test -s dist-bin/genesis

      - name: Build, push and resolve the digests
        id: push
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          for service in permesi genesis web; do
            image="ghcr.io/permesi/${service}"
            dockerfile="services/${service}/Dockerfile"
            if [[ "${service}" == "web" ]]; then
              dockerfile="apps/web/Dockerfile"
            fi
            ${CONTAINER_TOOL} build \
              -f "${dockerfile}" \
              -t "${image}:${tag}" \
              .
            ${CONTAINER_TOOL} push "${image}:${tag}"
          done
          resolve_digest() {
            local image="ghcr.io/permesi/$1:${tag}" digest="" attempt
            for attempt in {1..12}; do
              if ${CONTAINER_TOOL} pull "${image}" >/dev/null 2>&1; then
                digest="$(${CONTAINER_TOOL} image inspect "${image}" --format '{{join .RepoDigests "\n"}}' \
                  | awk -F@ '/^ghcr.io\/permesi\/'"$1"'@sha256:/ { print $2; exit }')"
              fi
              if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "${digest}"
                return 0
              fi
              echo "Waiting for ${image} to become pullable (${attempt}/12)..." >&2
              sleep 10
            done
            echo "Timed out waiting for ${image} to become pullable from GHCR." >&2
            return 1
          }
          for service in permesi genesis web; do
            echo "${service}_digest=$(resolve_digest "${service}")" >> "$GITHUB_OUTPUT"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Sign each immutable image digest keylessly with this workflow's identity.
      - name: Sign the images
        shell: bash
        env:
          PERMESI_DIGEST: ${{ steps.push.outputs.permesi_digest }}
          GENESIS_DIGEST: ${{ steps.push.outputs.genesis_digest }}
          WEB_DIGEST: ${{ steps.push.outputs.web_digest }}
        run: |
          set -euo pipefail
          for service in permesi genesis web; do
            case "${service}" in
              permesi) digest="${PERMESI_DIGEST}" ;;
              genesis) digest="${GENESIS_DIGEST}" ;;
              web) digest="${WEB_DIGEST}" ;;
            esac
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Bad digest for ${service}: ${digest}"; exit 1; }
            cosign sign --yes "ghcr.io/permesi/${service}@${digest}"
          done

      # Attest each image's OCI provenance in the registry; the attestations carry the
      # same subject digests the release tags.
      - name: Attest permesi image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/permesi/permesi
          subject-digest: ${{ steps.push.outputs.permesi_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest genesis image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/permesi/genesis
          subject-digest: ${{ steps.push.outputs.genesis_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest web image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/permesi/web
          subject-digest: ${{ steps.push.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false

  # The GitHub release gets exactly the built files and no others. Publishing creates the
  # tag at the tested commit.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [guard, build, web-dist, images]
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      RUST: ${{ needs.guard.outputs.rust }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history and tags: the release notes list the commits since the previous release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # A release cannot be completed later, so the file set is checked first. Keep this
      # list in step with the build jobs: a missing or extra file stops the release.
      - name: Check the release files
        shell: bash
        run: |
          set -euo pipefail
          expected="$(
            {
              for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
                echo "permesi-${VERSION}-${target}.tar.gz"
                echo "genesis-${VERSION}-${target}.tar.gz"
              done
              for arch in amd64 arm64; do
                echo "permesi_${VERSION}_${arch}.deb"
                echo "genesis_${VERSION}_${arch}.deb"
              done
              for arch in x86_64 aarch64; do
                echo "permesi-${VERSION}-1.${arch}.rpm"
                echo "genesis-${VERSION}-1.${arch}.rpm"
              done
              echo "permesi-web-dist-${VERSION}.tar.gz"
            } | sort
          )"
          actual="$(ls dist | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::The built files differ from the expected set."
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # A signed statement that this run built exactly these bytes:
      # `gh attestation verify <file> --repo permesi/permesi
      # --signer-workflow permesi/permesi/.github/workflows/release.yml` works on downloads.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      # The notes are the commit subjects since the previous release (version bumps left
      # out), so no changelog is kept by hand and every re-run writes the same text.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${GITHUB_SHA}" 2>/dev/null || true)"
          range="${GITHUB_SHA}"
          [[ -z "${previous}" ]] || range="${previous}..${GITHUB_SHA}"
          changes="$(git log --no-merges --format='- %s (%h)' "${range}" | grep -vE '^- bump version to [0-9]+\.[0-9]+\.[0-9]+ ' || true)"
          {
            echo "## Changes"
            echo
            echo "${changes:-- Only the version bump.}"
            if [[ -n "${previous}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${VERSION}"
            fi
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo 'sha256sum --check --ignore-missing SHA256SUMS'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo '```'
            echo
            echo "Built with Rust ${RUST}."
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      # Assets go on a draft first, so a failed upload never leaves a public half release.
      # A draft left by a failed run is replaced; a published release is left alone. The
      # guard made this the highest version, so it is GitHub's Latest release.
      - name: Create the release
        shell: bash
        run: |
          set -euo pipefail
          if state="$(gh release view "${VERSION}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${state}" == false ]]; then
              echo "Release ${VERSION} is already published."
              exit 0
            fi
            gh release delete "${VERSION}" --yes
          fi
          gh release create "${VERSION}" dist/* \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
          gh release edit "${VERSION}" --draft=false --latest

      # What a user can download must be exactly what was built, and the tag must sit on
      # the tested commit. This also runs when a re-run finds the release already published.
      - name: Check the published release
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')"
          if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${VERSION} points at ${tag_sha}, not at the tested commit ${GITHUB_SHA}."
            exit 1
          fi
          expected="$(ls dist | sort)"
          actual="$(gh release view "${VERSION}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Release ${VERSION} holds: $(tr '\n' ' ' <<<"${actual}"); expected: $(tr '\n' ' ' <<<"${expected}")."
            exit 1
          fi
          # The bytes too: download what a user would get and compare it with what was built.
          published="${RUNNER_TEMP}/published"
          rm -rf "${published}"
          gh release download "${VERSION}" --dir "${published}"
          if ! diff <(cd dist && sha256sum -- * | sort -k2) <(cd "${published}" && sha256sum -- * | sort -k2); then
            echo "::error::The published files differ from the files that were built."
            exit 1
          fi
          echo "Release ${VERSION} is on ${GITHUB_SHA} with $(wc -l <<<"${actual}") files."

  # Add the version tag (and `latest`, for the highest release) to the tested image
  # digests. skopeo copies within the same repository with the digest preserved, so
  # nothing is rebuilt or pushed anew; re-running is a no-op.
  images-publish:
    name: Tag Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [guard, images, release]
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.version }}
          token: ${{ github.token }}

      - name: Tag the tested digests
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          LATEST: ${{ steps.latest.outputs.latest }}
          PERMESI_DIGEST: ${{ needs.images.outputs.permesi_digest }}
          GENESIS_DIGEST: ${{ needs.images.outputs.genesis_digest }}
          WEB_DIGEST: ${{ needs.images.outputs.web_digest }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y skopeo; }
          echo "${TOKEN}" | skopeo login ghcr.io -u "${ACTOR}" --password-stdin
          tags=("${VERSION}")
          [[ "${LATEST}" != true ]] || tags+=(latest)
          for service in permesi genesis web; do
            case "${service}" in
              permesi) digest="${PERMESI_DIGEST}" ;;
              genesis) digest="${GENESIS_DIGEST}" ;;
              web) digest="${WEB_DIGEST}" ;;
            esac
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Bad digest for ${service}: ${digest}"; exit 1; }
            source="docker://ghcr.io/permesi/${service}@${digest}"
            skopeo inspect --raw "${source}" >/dev/null
            for tag in "${tags[@]}"; do
              skopeo copy --all --preserve-digests "${source}" "docker://ghcr.io/permesi/${service}:${tag}"
              actual="sha256:$(skopeo inspect --raw "docker://ghcr.io/permesi/${service}:${tag}" | sha256sum | cut -d' ' -f1)"
              if [[ "${actual}" != "${digest}" ]]; then
                echo "::error::ghcr.io/permesi/${service}:${tag} is ${actual}, not the tested ${digest}."
                exit 1
              fi
              echo "ghcr.io/permesi/${service}:${tag} -> ${digest}"
            done
          done

  # Deploy the signed production web build to Cloudflare Pages, only while this is the
  # highest release.
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [guard, web-dist, release]
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.version }}
          token: ${{ github.token }}

      - name: Download the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-web
          path: ${{ runner.temp }}/web

      - name: Unpack it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/site"
          tar -xzf "${RUNNER_TEMP}/web/permesi-web-dist-${VERSION}.tar.gz" -C "${RUNNER_TEMP}/site"
          test -f "${RUNNER_TEMP}/site/dist/index.html"

      - name: Set up Node
        if: steps.latest.outputs.latest == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Cloudflare Pages
        if: steps.latest.outputs.latest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy "${RUNNER_TEMP}/site/dist" --project-name permesi --branch main

      - name: Not the latest release
        if: steps.latest.outputs.latest != 'true'
        env:
          HIGHEST: ${{ steps.latest.outputs.highest }}
        run: echo "A newer release (${HIGHEST}) is in production; Cloudflare Pages left alone."

  # Dispatch Helm with the tested digests, only while this is the highest release.
  helm:
    name: Dispatch Helm Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard, images, images-publish]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.version }}
          token: ${{ github.token }}

      - name: Dispatch release to permesi-helm
        if: steps.latest.outputs.latest == 'true'
        uses: ./.github/actions/dispatch-helm
        with:
          version: ${{ needs.guard.outputs.version }}
          source_sha: ${{ github.sha }}
          permesi_digest: ${{ needs.images.outputs.permesi_digest }}
          genesis_digest: ${{ needs.images.outputs.genesis_digest }}
          web_digest: ${{ needs.images.outputs.web_digest }}
          tag_only: 'false'
          app_id: ${{ vars.PERMESI_HELM_APP_ID }}
          private_key: ${{ secrets.PERMESI_HELM_APP_PRIVATE_KEY }}

      - name: Not the latest release
        if: steps.latest.outputs.latest != 'true'
        env:
          HIGHEST: ${{ steps.latest.outputs.highest }}
        run: echo "A newer release (${HIGHEST}) is in production; Helm left alone."

  # Publish the committed OpenAPI specs; the guard checked they carry the version.
  docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [guard, release]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.version }}
          token: ${{ github.token }}

      - name: Build Redoc Page
        if: steps.latest.outputs.latest == 'true'
        run: |
          mkdir -p docs/redoc
          cp apps/web/public/logo.svg docs/redoc/logo.svg
          cp docs/openapi/*.json docs/redoc/

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.latest == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/redoc
