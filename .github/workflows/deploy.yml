---
name: Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Recovery: an existing X.Y.Z tag whose publishing failed. Run on main; it checks
          the tag like its own run would and publishes the tag's candidate artifacts.
        required: false
        default: ''

# Runs of the same ref (recovery runs on main, candidate runs on release) wait in order;
# `queue: max` keeps every pending run instead of replacing the pending one.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

# Read-only by default; jobs that publish ask for more.
permissions:
  contents: read

jobs:
  # Classifies the run for the jobs below.
  # - `candidate`: a manual (workflow_dispatch) run on a branch, which `just deploy`
  #   starts on the release candidate before any tag exists. It tests and builds
  #   everything once: the musl archives and Debian packages, the signed production
  #   web build, and the three images, pushed to GHCR only as `:sha-<commit>`. It keeps
  #   the files with a manifest of their SHA-256 sums and the image digests, and
  #   publishes nothing.
  # - `release`: a pushed X.Y.Z tag. It builds nothing. The signed tag names its
  #   candidate run; the guard checks that run and the tag's commit, and the jobs below
  #   publish exactly the manifest's files and image digests (GitHub release, image
  #   tags, Cloudflare Pages, Helm, API docs), so what ships is what was tested.
  # - `recover`: a manual run on main with `publish: X.Y.Z`, for a tag whose publishing
  #   failed in a way re-running its jobs cannot fix. It applies the same checks to that
  #   tag and publishes its candidate artifacts with main's workflow; the tag itself
  #   never changes.
  # - `test-tag`: any other tag, or a manual run on a tag (t-* from `just t-deploy`):
  #   tests and builds only.
  # The production-facing steps (GitHub's Latest release, the `latest` image tag,
  # Cloudflare Pages, Helm and the API docs) each check right before they act that the
  # tag is the highest promoted release (.github/actions/release-is-latest), and each runs
  # in its own concurrency group across runs with `queue: max` (every pending job waits
  # its turn instead of being replaced), so a late or re-run job of an older tag never
  # rolls production back and a newer release is never cancelled by an older one.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      version: ${{ steps.classify.outputs.version }}
      tag: ${{ steps.classify.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      candidate_run: ${{ steps.release.outputs.candidate_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the run
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          tag=""
          if [[ "${EVENT}" == workflow_dispatch && -n "${PUBLISH:-}" ]]; then
            if [[ "${GITHUB_REF}" != refs/heads/main || ! "${PUBLISH}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A recovery run needs an X.Y.Z tag in 'publish' and must run on main."
              exit 1
            fi
            kind=recover
            tag="${PUBLISH}"
            version="${PUBLISH}"
          elif [[ "${EVENT}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/* ]]; then
            kind=candidate
          elif [[ "${EVENT}" == push && "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind=release
            tag="${GITHUB_REF_NAME}"
          else
            kind=test-tag
            # Test builds are named after the ref; only safe characters reach file names.
            version="test"
            if [[ "${GITHUB_REF_NAME}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              version="${GITHUB_REF_NAME}"
            fi
          fi
          if [[ "${kind}" != test-tag && ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml has no X.Y.Z workspace version (found '${version}')."
            exit 1
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "${EVENT} on ${GITHUB_REF} classified as ${kind} (version ${version}${tag:+, tag ${tag}})."

      # Everything is read through the API, so it holds for any tag, however far main
      # has moved on since.
      - name: Require the tag's commit, version, Test & Build run and candidate run
        id: release
        if: steps.classify.outputs.kind == 'release' || steps.classify.outputs.kind == 'recover'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.classify.outputs.tag }}
          KIND: ${{ steps.classify.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          # The signed tag names the candidate run whose artifacts it releases.
          read -r type object <<<"$(gh api "repos/${repo}/git/ref/tags/${TAG}" --jq '"\(.object.type) \(.object.sha)"')"
          if [[ "${type}" != tag ]]; then
            echo "::error::${TAG} is not an annotated tag; refusing to release."
            exit 1
          fi
          read -r verified commit <<<"$(gh api "repos/${repo}/git/tags/${object}" --jq '"\(.verification.verified) \(.object.sha)"')"
          message="$(gh api "repos/${repo}/git/tags/${object}" --jq '.message')"
          if [[ "${verified}" != true ]]; then
            echo "::error::The signature of tag ${TAG} is not verified by GitHub; refusing to release."
            exit 1
          fi
          if [[ "${KIND}" == release && "${commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${commit}, but this run is for ${GITHUB_SHA}."
            exit 1
          fi
          status="$(gh api "repos/${repo}/compare/${commit}...main" --jq '.status')"
          if [[ "${status}" != identical && "${status}" != ahead ]]; then
            echo "::error::Tag ${TAG} points at ${commit}, which is not on main (${status}); refusing to release."
            exit 1
          fi
          version="$(gh api "repos/${repo}/contents/Cargo.toml?ref=${commit}" --jq '.content' | base64 -d | awk -F'"' '/^version = /{print $2; exit}')"
          if [[ "${version}" != "${TAG}" ]]; then
            echo "::error::Tag ${TAG} does not match the workspace version ${version} at ${commit}; refusing to release."
            exit 1
          fi
          passed="$(gh run list --repo "${repo}" --workflow build.yml \
            --commit "${commit}" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${passed}" ]]; then
            echo "::error::${commit} has no successful Test & Build run; refusing to release ${TAG}."
            exit 1
          fi
          candidate_run="$(sed -n 's/^Candidate run: \([0-9][0-9]*\)$/\1/p' <<<"${message}" | head -n 1)"
          if [[ -z "${candidate_run}" ]]; then
            echo "::error::Tag ${TAG} names no candidate run; refusing to publish untested artifacts."
            exit 1
          fi
          read -r head_sha event conclusion path <<<"$(gh api "repos/${repo}/actions/runs/${candidate_run}" \
            --jq '"\(.head_sha) \(.event) \(.conclusion) \(.path)"')"
          if [[ "${head_sha}" != "${commit}" || "${event}" != workflow_dispatch || "${conclusion}" != success || "${path}" != .github/workflows/deploy.yml* ]]; then
            echo "::error::Run ${candidate_run} is not a successful candidate run of ${commit} (${head_sha} ${event} ${conclusion} ${path})."
            exit 1
          fi
          {
            echo "commit=${commit}"
            echo "candidate_run=${candidate_run}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG}: ${commit} is on main, passed Test & Build (run ${passed}) and candidate run ${candidate_run}."

  # ----- Candidate and test tags: test and build everything once -----

  test:
    needs: guard
    if: needs.guard.outputs.kind == 'candidate' || needs.guard.outputs.kind == 'test-tag'
    uses: ./.github/workflows/test.yml
    with:
      runner: ubuntu-latest

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [guard, test]
    if: needs.guard.outputs.kind == 'candidate' || needs.guard.outputs.kind == 'test-tag'
    env:
      VERSION: ${{ needs.guard.outputs.version }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - run: sudo apt -y install musl-dev musl-tools
        if: matrix.build == 'linux'

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p permesi -p genesis --features permesi/telemetry,genesis/telemetry

      - name: Build archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for binary_name in permesi genesis; do
            dirname="${binary_name}-${VERSION}-${TARGET}"
            mkdir "$dirname"
            mv "target/${TARGET}/release/$binary_name" "$dirname"
            tar -czf "dist/$dirname.tar.gz" "$dirname"
          done

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb

      - name: Build Debian packages
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p permesi -p genesis --features permesi/telemetry,genesis/telemetry
          cargo deb -p permesi --no-build
          cargo deb -p genesis --no-build
          mv "$(ls target/debian/permesi_*.deb)" "dist/permesi_${VERSION}_amd64.deb"
          mv "$(ls target/debian/genesis_*.deb)" "dist/genesis_${VERSION}_amd64.deb"
          ls -al dist

      # The release tag publishes exactly these files, downloaded from this run.
      - name: Upload the binaries and packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-binaries
          path: dist/*
          if-no-files-found: error

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [guard, test]
    if: needs.guard.outputs.kind == 'candidate' || needs.guard.outputs.kind == 'test-tag'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      # No build cache in the release workflow: what the candidate builds ships, so it is
      # built from source only, never from a cache another run could have written.
      - name: Install Trunk
        run: ./scripts/install-trunk

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      # A release candidate is built for production (permesi.com).
      - name: Set Frontend Env
        shell: bash
        env:
          PERMESI_CLIENT_ID: ${{ vars.PERMESI_CLIENT_ID }}
          PERMESI_API_BASE_URL: ${{ vars.PERMESI_API_BASE_URL }}
          PERMESI_TOKEN_BASE_URL: ${{ vars.PERMESI_TOKEN_BASE_URL }}
          PERMESI_OPAQUE_SERVER_ID: ${{ vars.PERMESI_OPAQUE_SERVER_ID }}
        run: |
          domain="permesi.com"
          api_base="${PERMESI_API_BASE_URL:-https://api.${domain}}"
          token_base="${PERMESI_TOKEN_BASE_URL:-https://genesis.${domain}}"
          opaque_id="${PERMESI_OPAQUE_SERVER_ID:-api.${domain}}"
          client_id="${PERMESI_CLIENT_ID:-00000000-0000-0000-0000-000000000000}"
          {
            echo "PERMESI_API_BASE_URL=${api_base}"
            echo "PERMESI_TOKEN_BASE_URL=${token_base}"
            echo "PERMESI_OPAQUE_SERVER_ID=${opaque_id}"
            echo "PERMESI_CLIENT_ID=${client_id}"
          } >> "$GITHUB_ENV"

      - name: Build CSS
        working-directory: apps/web
        run: npm run css:build

      - name: Clean Frontend Target
        run: cargo clean -p permesi_web --target wasm32-unknown-unknown

      - name: Build Frontend
        working-directory: apps/web
        run: trunk build --release

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: apps/web/dist
          if-no-files-found: error

  # Sign the production web build once (checksums, cosign, build provenance); the tag
  # deploys this signed build to Cloudflare Pages and attaches it to the release.
  frontend-sign:
    name: Sign Frontend
    needs: [guard, frontend-build]
    if: needs.guard.outputs.kind == 'candidate'
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      runner: ubuntu-latest
      deploy: false
    secrets: inherit

  web-dist:
    name: Package Frontend
    runs-on: ubuntu-latest
    needs: [guard, frontend-sign]
    if: needs.guard.outputs.kind == 'candidate'
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - name: Download the signed web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist-signed
          path: dist

      - name: Package it
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir out
          tar -czf "out/permesi-web-dist-${VERSION}.tar.gz" dist
          ls -al out

      - name: Upload the web build package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-web
          path: out/*
          if-no-files-found: error

  # Build the images once and push them only under a commit tag; the release adds its
  # version tags to exactly these digests.
  images:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [guard, build, frontend-build]
    if: needs.guard.outputs.kind == 'candidate'
    permissions:
      contents: read
      packages: write
    outputs:
      permesi_digest: ${{ steps.push.outputs.permesi_digest }}
      genesis_digest: ${{ steps.push.outputs.genesis_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ensure-container-runtime

      - name: Login to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${TOKEN}" | ${CONTAINER_TOOL} login ghcr.io -u "${ACTOR}" --password-stdin

      - name: Download Frontend Dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: apps/web/dist

      - name: Verify Frontend Dist layout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d apps/web/dist/dist && ! -f apps/web/dist/index.html ]]; then
            shopt -s dotglob
            mv apps/web/dist/dist/* apps/web/dist/
            rmdir apps/web/dist/dist
          fi
          test -f apps/web/dist/index.html

      - name: Build, push and resolve the digests
        id: push
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          for service in permesi genesis web; do
            image="ghcr.io/permesi/${service}"
            dockerfile="services/${service}/Dockerfile"
            if [[ "${service}" == "web" ]]; then
              dockerfile="apps/web/Dockerfile"
            fi
            ${CONTAINER_TOOL} build \
              --build-arg "BUILD_GIT_COMMIT_HASH=${GITHUB_SHA}" \
              -f "${dockerfile}" \
              -t "${image}:${tag}" \
              .
            ${CONTAINER_TOOL} push "${image}:${tag}"
          done
          resolve_digest() {
            local image="ghcr.io/permesi/$1:${tag}" digest="" attempt
            for attempt in {1..12}; do
              if ${CONTAINER_TOOL} pull "${image}" >/dev/null 2>&1; then
                digest="$(${CONTAINER_TOOL} image inspect "${image}" --format '{{join .RepoDigests "\n"}}' \
                  | awk -F@ '/^ghcr.io\/permesi\/'"$1"'@sha256:/ { print $2; exit }')"
              fi
              if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "${digest}"
                return 0
              fi
              echo "Waiting for ${image} to become pullable (${attempt}/12)..." >&2
              sleep 10
            done
            echo "Timed out waiting for ${image} to become pullable from GHCR." >&2
            return 1
          }
          for service in permesi genesis web; do
            echo "${service}_digest=$(resolve_digest "${service}")" >> "$GITHUB_OUTPUT"
          done

  # The candidate's manifest: the SHA-256 of every release file, the image digests, the
  # version, the commit and the artifacts the release needs. `just deploy` checks it and
  # those artifacts before tagging, and the release publishes exactly what it lists.
  manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    needs: [guard, build, web-dist, images]
    if: needs.guard.outputs.kind == 'candidate'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download this run's release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: artifacts

      # Every expected artifact must be here with all its files, so a lost artifact can
      # never produce a partial release. Keep this in step with the build jobs.
      - name: Check the inventory
        shell: bash
        env:
          EXPECTED: dist-binaries=4 dist-web=1
        run: |
          set -euo pipefail
          for entry in ${EXPECTED}; do
            name="${entry%=*}"
            count="$(find "artifacts/${name}" -maxdepth 1 -type f 2>/dev/null | wc -l)"
            if [[ "${count}" -ne "${entry#*=}" ]]; then
              echo "::error::Artifact ${name} has ${count} files, expected ${entry#*=}."
              exit 1
            fi
          done
          actual="$(find artifacts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')"
          wanted="$(for entry in ${EXPECTED}; do echo "${entry%=*}"; done | sort | tr '\n' ' ')"
          if [[ "${actual}" != "${wanted}" ]]; then
            echo "::error::Found artifacts ${actual}, expected ${wanted}."
            exit 1
          fi

      - name: Write the manifest
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          EXPECTED: dist-binaries=4 dist-web=1
          PERMESI_DIGEST: ${{ needs.images.outputs.permesi_digest }}
          GENESIS_DIGEST: ${{ needs.images.outputs.genesis_digest }}
          WEB_DIGEST: ${{ needs.images.outputs.web_digest }}
        run: |
          set -euo pipefail
          mkdir dist manifest
          find artifacts -type f -exec cp -n {} dist/ \;
          (cd dist && sha256sum -- *) > manifest/SHA256SUMS
          if [[ "$(wc -l < manifest/SHA256SUMS)" -ne 5 ]]; then
            echo "::error::Expected 5 release files (a name collision?), got $(wc -l < manifest/SHA256SUMS)."
            exit 1
          fi
          for entry in "permesi ${PERMESI_DIGEST}" "genesis ${GENESIS_DIGEST}" "web ${WEB_DIGEST}"; do
            if [[ ! "${entry#* }" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Image ${entry% *} has no valid digest (got '${entry#* }')."
              exit 1
            fi
            echo "${entry}"
          done > manifest/IMAGES
          {
            echo "VERSION=${VERSION}"
            echo "COMMIT=${GITHUB_SHA}"
          } > manifest/release.env
          # The artifacts the release publishes from; just deploy checks they all remain.
          for entry in ${EXPECTED}; do echo "${entry%=*}"; done > manifest/ARTIFACTS
          cat manifest/*

      - name: Upload the manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: manifest/*
          if-no-files-found: error

      # A signed statement that this run built exactly these bytes; the release publishes
      # the same files, so `gh attestation verify <file> --repo permesi/permesi
      # --signer-workflow permesi/permesi/.github/workflows/deploy.yml` works on downloads.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # ----- Release tags and recovery runs: publish only, nothing is built -----

  # The GitHub release gets exactly the files of the candidate run's manifest, and no
  # others. Safe to re-run: the release is updated in place, existing assets are
  # overwritten and stray ones removed; it is GitHub's Latest release only when the tag
  # is the highest promoted release at that moment.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'recover'
    concurrency:
      group: permesi-production-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    steps:
      # Full history and tags: the release notes list the commits since the previous
      # release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the candidate run's manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: release-manifest
          path: manifest

      - name: Download the candidate run's release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Check the files against the manifest
        shell: bash
        env:
          TAG_VERSION: ${{ needs.guard.outputs.version }}
          TAG_COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          set -euo pipefail
          . manifest/release.env
          if [[ "${VERSION}" != "${TAG_VERSION}" || "${COMMIT}" != "${TAG_COMMIT}" ]]; then
            echo "::error::The candidate manifest is for ${VERSION} at ${COMMIT}, not ${TAG_VERSION} at ${TAG_COMMIT}."
            exit 1
          fi
          listed="$(awk '{print $2}' manifest/SHA256SUMS | sort)"
          present="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${listed}" != "${present}" ]]; then
            echo "::error::The downloaded files do not match the manifest."
            diff <(echo "${listed}") <(echo "${present}") || true
            exit 1
          fi
          (cd dist && sha256sum -c ../manifest/SHA256SUMS)
          cp manifest/SHA256SUMS dist/

      # The notes are the commit subjects since the previous release (the version bump
      # itself left out), so they need no hand-kept changelog and every re-run writes the
      # same text.
      - name: Write the release notes
        shell: bash
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "refs/tags/${TAG}^" 2>/dev/null || true)"
          range="refs/tags/${TAG}"
          [[ -z "${previous}" ]] || range="${previous}..refs/tags/${TAG}"
          changes="$(git log --no-merges --format='- %s (%h)' "${range}" | grep -vE '^- bump version to [0-9]+\.[0-9]+\.[0-9]+ ' || true)"
          {
            echo "## Changes"
            echo
            echo "${changes:-- Only the version bump.}"
            if [[ -n "${previous}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
            fi
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo 'sha256sum --check --ignore-missing SHA256SUMS'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/deploy.yml"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.tag }}
          token: ${{ github.token }}

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          draft: false
          make_latest: ${{ steps.latest.outputs.latest }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*

      - name: Keep exactly the manifest's files on the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          while read -r asset; do
            [[ -n "${asset}" ]] || continue
            if ! grep -qxF "${asset}" <<<"${expected}"; then
              echo "Removing ${asset}, which is not in the candidate manifest."
              gh release delete-asset "${TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done < <(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          actual="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Release ${TAG} holds $(tr '\n' ' ' <<<"${actual}"), expected $(tr '\n' ' ' <<<"${expected}")."
            exit 1
          fi

  # Add the version tag (and `latest`, for the highest release) to the candidate's image
  # digests. skopeo copies within the same repository with the digest preserved, so
  # nothing is rebuilt or pushed anew; re-running is a no-op.
  images-publish:
    name: Tag Images
    runs-on: ubuntu-latest
    needs: [guard, release]
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'recover'
    concurrency:
      group: permesi-production-images
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      permesi_digest: ${{ steps.tag.outputs.permesi_digest }}
      genesis_digest: ${{ steps.tag.outputs.genesis_digest }}
      web_digest: ${{ steps.tag.outputs.web_digest }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.tag }}
          token: ${{ github.token }}

      - name: Download the candidate run's manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: release-manifest
          path: ${{ runner.temp }}/manifest

      - name: Tag the tested digests
        id: tag
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.guard.outputs.version }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y skopeo; }
          echo "${TOKEN}" | skopeo login ghcr.io -u "${ACTOR}" --password-stdin
          tags=("${VERSION}")
          [[ "${LATEST}" != true ]] || tags+=(latest)
          while read -r service digest; do
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Bad digest for ${service}: ${digest}"; exit 1; }
            source="docker://ghcr.io/permesi/${service}@${digest}"
            skopeo inspect --raw "${source}" >/dev/null
            for tag in "${tags[@]}"; do
              skopeo copy --all --preserve-digests "${source}" "docker://ghcr.io/permesi/${service}:${tag}"
              actual="sha256:$(skopeo inspect --raw "docker://ghcr.io/permesi/${service}:${tag}" | sha256sum | cut -d' ' -f1)"
              if [[ "${actual}" != "${digest}" ]]; then
                echo "::error::ghcr.io/permesi/${service}:${tag} is ${actual}, not the tested ${digest}."
                exit 1
              fi
              echo "ghcr.io/permesi/${service}:${tag} -> ${digest}"
            done
            echo "${service}_digest=${digest}" >> "$GITHUB_OUTPUT"
          done < "${RUNNER_TEMP}/manifest/IMAGES"

  # Deploy the candidate's signed production web build to Cloudflare Pages, only while
  # the tag is the highest promoted release.
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [guard, release]
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'recover'
    concurrency:
      group: permesi-production-frontend
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.tag }}
          token: ${{ github.token }}

      - name: Download the candidate run's manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: release-manifest
          path: ${{ runner.temp }}/manifest

      - name: Download the candidate run's web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: dist-web
          path: ${{ runner.temp }}/web

      - name: Check and unpack it
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          package="permesi-web-dist-${VERSION}.tar.gz"
          (cd "${RUNNER_TEMP}/web" && grep " ${package}\$" "${RUNNER_TEMP}/manifest/SHA256SUMS" | sha256sum -c -)
          mkdir -p "${RUNNER_TEMP}/site"
          tar -xzf "${RUNNER_TEMP}/web/${package}" -C "${RUNNER_TEMP}/site"
          test -f "${RUNNER_TEMP}/site/dist/index.html"

      - name: Set up Node
        if: steps.latest.outputs.latest == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Cloudflare Pages
        if: steps.latest.outputs.latest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy "${RUNNER_TEMP}/site/dist" --project-name permesi --branch main

      - name: Not the latest release
        if: steps.latest.outputs.latest != 'true'
        env:
          HIGHEST: ${{ steps.latest.outputs.highest }}
        run: echo "A newer release (${HIGHEST}) is in production; Cloudflare Pages left alone."

  # Dispatch Helm with the tested digests, only while the tag is the highest promoted
  # release: checked right here, inside the Helm group, so a delayed older run cannot
  # dispatch after a newer release.
  helm:
    name: Dispatch Helm Release
    runs-on: ubuntu-latest
    needs: [guard, images-publish]
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'recover'
    concurrency:
      group: permesi-production-helm
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.tag }}
          token: ${{ github.token }}

      - name: Dispatch release to permesi-helm
        if: steps.latest.outputs.latest == 'true'
        uses: ./.github/actions/dispatch-helm
        with:
          version: ${{ needs.guard.outputs.tag }}
          source_sha: ${{ needs.guard.outputs.commit }}
          permesi_digest: ${{ needs.images-publish.outputs.permesi_digest }}
          genesis_digest: ${{ needs.images-publish.outputs.genesis_digest }}
          web_digest: ${{ needs.images-publish.outputs.web_digest }}
          app_id: ${{ vars.PERMESI_HELM_APP_ID }}
          private_key: ${{ secrets.PERMESI_HELM_APP_PRIVATE_KEY }}

      - name: Not the latest release
        if: steps.latest.outputs.latest != 'true'
        env:
          HIGHEST: ${{ steps.latest.outputs.highest }}
        run: echo "A newer release (${HIGHEST}) is in production; Helm left alone."

  # Publish the tag's committed OpenAPI specs: `just deploy` regenerated and compared
  # them before promoting, so nothing is generated here.
  docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [guard, release]
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'recover'
    concurrency:
      group: permesi-production-docs
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.tag }}
          token: ${{ github.token }}

      - name: Checkout the tag's sources
        if: steps.latest.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.guard.outputs.tag }}
          path: tagged
          persist-credentials: false

      - name: Check the specs carry the release version
        if: steps.latest.outputs.latest == 'true'
        working-directory: tagged
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for spec in docs/openapi/permesi.json docs/openapi/genesis.json; do
            found="$(jq -r .info.version "${spec}")"
            if [[ "${found}" != "${VERSION}" ]]; then
              echo "::error::${spec} is for ${found}, not ${VERSION}."
              exit 1
            fi
          done

      - name: Build Redoc Page
        if: steps.latest.outputs.latest == 'true'
        working-directory: tagged
        run: |
          mkdir -p docs/redoc
          cp apps/web/public/logo.svg docs/redoc/logo.svg
          cp docs/openapi/*.json docs/redoc/

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.latest == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tagged/docs/redoc
