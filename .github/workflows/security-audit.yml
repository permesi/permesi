---
name: Rust Security Audit

on:
  workflow_dispatch:
  schedule:
    # Weekly coverage catches newly published advisories without duplicating every CI run.
    - cron: '23 4 * * 1'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - .github/workflows/security-audit.yml
  push:
    branches:
      - main
      - develop
      - sandbox
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - .github/workflows/security-audit.yml

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --deny unsound --deny yanked
