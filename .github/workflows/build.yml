---
name: Test & Build

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

# Superseded development pushes must not occupy scarce fixture runners. Keep
# candidate/main runs independent so a newer run cannot cancel release evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref_name == 'sandbox' || github.ref_name == 'develop') && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref_name == 'sandbox' || github.ref_name == 'develop' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      cache: true

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      matrix:
        include:
          - build: linux
            os: ${{ vars.CI_RUNNER || 'self-hosted' }}
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Branch name
        run: echo "${GITHUB_REF##*/}"

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-musl

      - uses: ./.github/actions/ensure-musl-toolchain
        if: matrix.build == 'linux'
        timeout-minutes: 5

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p permesi -p genesis --features permesi/telemetry,genesis/telemetry

  frontend-build:
    name: Build Frontend
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Trunk
        run: ./scripts/install-trunk

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Set Frontend Env
        shell: bash
        env:
          PERMESI_CLIENT_ID: ${{ vars.PERMESI_CLIENT_ID }}
          PERMESI_API_BASE_URL: ${{ vars.PERMESI_API_BASE_URL }}
          PERMESI_TOKEN_BASE_URL: ${{ vars.PERMESI_TOKEN_BASE_URL }}
          PERMESI_OPAQUE_SERVER_ID: ${{ vars.PERMESI_OPAQUE_SERVER_ID }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            domain="permesi.com"
          else
            domain="permesi.dev"
          fi
          api_base="${PERMESI_API_BASE_URL:-https://api.${domain}}"
          token_base="${PERMESI_TOKEN_BASE_URL:-https://genesis.${domain}}"
          opaque_id="${PERMESI_OPAQUE_SERVER_ID:-api.${domain}}"
          client_id="${PERMESI_CLIENT_ID:-00000000-0000-0000-0000-000000000000}"
          {
            echo "PERMESI_API_BASE_URL=${api_base}"
            echo "PERMESI_TOKEN_BASE_URL=${token_base}"
            echo "PERMESI_OPAQUE_SERVER_ID=${opaque_id}"
            echo "PERMESI_CLIENT_ID=${client_id}"
          } >> "$GITHUB_ENV"

      - name: Build CSS
        working-directory: apps/web
        run: npm run css:build

      - name: Clean Frontend Artifacts
        shell: bash
        run: |
          rm -rf apps/web/dist
          cargo clean -p permesi_web

      - name: Build Frontend
        working-directory: apps/web
        run: trunk build --release

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/web/dist
          if-no-files-found: error
          overwrite: true

  # The scratch `release` branch only exists for `just deploy` to test a release
  # candidate; it gets no Cloudflare Pages preview of its own.
  deploy-frontend:
    name: Deploy Frontend
    needs: frontend-build
    if: github.ref_name != 'release'
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit

  scenario-build:
    name: Build scenario binaries
    needs: test
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-tests
      - name: Build exact checked-out service and runner binaries
        env:
          BUILD_GIT_COMMIT_HASH: ${{ github.sha }}
        run: cargo build --locked --timings -p permesi -p genesis -p permesi-oauth-scenario
      # A tar archive preserves executable permissions through artifact transport.
      - name: Package scenario binaries
        run: |
          mkdir -p .tmp/scenario-binaries
          for binary in permesi genesis permesi-oauth-scenario; do
            objcopy --strip-debug "target/debug/${binary}" ".tmp/scenario-binaries/${binary}"
          done
          tar -czf .tmp/scenario-binaries.tar.gz -C .tmp/scenario-binaries permesi genesis permesi-oauth-scenario
          stat -c 'Scenario archive: %s bytes' .tmp/scenario-binaries.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: scenario-binaries-${{ github.sha }}
          path: .tmp/scenario-binaries.tar.gz
          if-no-files-found: error
          overwrite: true

  oauth-scenarios:
    name: OAuth scenarios (${{ matrix.replicas }} replicas)
    needs: [test, frontend-build, scenario-build]
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    env:
      PERMESI_SCENARIO_EXPECTED_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      # Each topology runs several local PostgreSQL/Vault/service stacks, and the
      # harness starts two more stacks concurrently. Share the host sequentially.
      max-parallel: 1
      matrix:
        replicas: [3, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/web/dist
      - uses: actions/download-artifact@v8
        with:
          name: scenario-binaries-${{ github.sha }}
          path: .tmp/scenario-binaries
      - name: Unpack same-run scenario binaries
        run: |
          mkdir -p target/debug
          tar -xzf .tmp/scenario-binaries/scenario-binaries.tar.gz -C target/debug
      - uses: ./.github/actions/ensure-container-runtime
        env:
          PERMESI_TEST_REQUIRE_PODMAN: '1'
      - name: Run all real OAuth scenarios
        run: target/debug/permesi-oauth-scenario --replicas ${{ matrix.replicas }} --suite full --access-token-ttl-seconds 10 --report-dir .tmp/oauth-scenario-ci
      - name: Verify recovery ownership guards
        run: python3 -m unittest discover -s tools/oauth_scenario/tests -p '*_test.py'
      - name: Verify harness cleanup and isolation
        run: python3 tools/oauth_scenario/tests/harness.py --replicas ${{ matrix.replicas }}
      - name: Upload sanitized scenario reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oauth-scenario-reports-${{ matrix.replicas }}-replicas
          path: |
            .tmp/oauth-scenario-ci/**/report.json
            .tmp/oauth-scenario-ci/**/junit.xml
            .tmp/oauth-scenario-ci/**/ownership-*.json
          if-no-files-found: warn

  browser-tests:
    name: Browser tests
    needs: [test, frontend-build]
    # Use a fresh host for browser profiles and the preinstalled Chromium-compatible browser.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/web/dist
      - uses: ./.github/actions/ensure-container-runtime
        env:
          PERMESI_TEST_REQUIRE_PODMAN: '1'
      - name: Install browser test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh
          cargo install just --locked --version 1.58.0
      - uses: ./.github/actions/ensure-browser-runtime
      - name: Run console and real PostgreSQL browser tests
        run: just web-test-browser-built

  package:
    name: Package GHCR
    needs: [build, frontend-build]
    if: github.ref_name == 'develop'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/ensure-container-runtime

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ${CONTAINER_TOOL} login ghcr.io -u "${{ github.actor }}"
          --password-stdin

      - name: Download Frontend Dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/web/dist

      - name: Verify Frontend Dist layout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d apps/web/dist/dist && ! -f apps/web/dist/index.html ]]; then
            shopt -s dotglob
            mv apps/web/dist/dist/* apps/web/dist/
            rmdir apps/web/dist/dist
          fi
          test -f apps/web/dist/index.html

      - name: Build & Push images
        shell: bash
        run: |-
          set -euo pipefail
          for service in permesi genesis web; do
            image="ghcr.io/permesi/${service}"
            dockerfile="services/${service}/Dockerfile"
            if [[ "${service}" == "web" ]]; then
              dockerfile="apps/web/Dockerfile"
            fi
            ${CONTAINER_TOOL} build \
              --build-arg "BUILD_GIT_COMMIT_HASH=${GITHUB_SHA}" \
              -f "${dockerfile}" \
              -t "${image}:develop" \
              .
            ${CONTAINER_TOOL} push "${image}:develop"
          done

  # One aggregate check for branch protection and the release flow: it passes only
  # when every test and build job succeeded, so the required check never depends on
  # job or matrix names. Coverage and the deploy/package side effects are not gates.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - build
      - frontend-build
      - scenario-build
      - oauth-scenarios
      - browser-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done
