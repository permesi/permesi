---
name: Test & Build

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

# Superseded development pushes must not occupy scarce fixture runners. Keep other
# branch runs independent so a newer run cannot cancel their evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref_name == 'sandbox' || github.ref_name == 'develop') && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref_name == 'sandbox' || github.ref_name == 'develop' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      cache: true

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  # The builds, scenarios and browser tests start with the tests instead of after them:
  # the three runners sit idle otherwise. `CI OK` still needs every one of them, and the
  # jobs that publish (`deploy-frontend`, `package`) wait for the tests explicitly.
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ${{ vars.CI_RUNNER || 'self-hosted' }}
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Branch name
        run: echo "${GITHUB_REF##*/}"

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-musl

      - uses: ./.github/actions/ensure-musl-toolchain
        if: matrix.build == 'linux'
        timeout-minutes: 5

      - name: Build
        env:
          BUILD_GIT_COMMIT_HASH: ${{ github.sha }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p permesi -p genesis --features permesi/telemetry,genesis/telemetry

      - name: Upload image binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-binaries
          path: |
            target/${{ matrix.target }}/release/permesi
            target/${{ matrix.target }}/release/genesis
          if-no-files-found: error
          overwrite: true

  frontend-build:
    name: Build Frontend
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target

      - name: Install Trunk
        run: ./scripts/install-trunk

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Set Frontend Env
        shell: bash
        env:
          PERMESI_CLIENT_ID: ${{ vars.PERMESI_CLIENT_ID }}
          PERMESI_API_BASE_URL: ${{ vars.PERMESI_API_BASE_URL }}
          PERMESI_TOKEN_BASE_URL: ${{ vars.PERMESI_TOKEN_BASE_URL }}
          PERMESI_OPAQUE_SERVER_ID: ${{ vars.PERMESI_OPAQUE_SERVER_ID }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            domain="permesi.com"
          else
            domain="permesi.dev"
          fi
          api_base="${PERMESI_API_BASE_URL:-https://api.${domain}}"
          token_base="${PERMESI_TOKEN_BASE_URL:-https://genesis.${domain}}"
          opaque_id="${PERMESI_OPAQUE_SERVER_ID:-api.${domain}}"
          client_id="${PERMESI_CLIENT_ID:-00000000-0000-0000-0000-000000000000}"
          {
            echo "PERMESI_API_BASE_URL=${api_base}"
            echo "PERMESI_TOKEN_BASE_URL=${token_base}"
            echo "PERMESI_OPAQUE_SERVER_ID=${opaque_id}"
            echo "PERMESI_CLIENT_ID=${client_id}"
          } >> "$GITHUB_ENV"

      - name: Build CSS
        working-directory: apps/web
        run: npm run css:build

      - name: Clean Frontend Artifacts
        shell: bash
        run: |
          rm -rf apps/web/dist
          cargo clean -p permesi_web

      - name: Build Frontend
        working-directory: apps/web
        run: trunk build --release

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: apps/web/dist
          if-no-files-found: error
          overwrite: true

  # Production frontend publication belongs to release.yml. Ordinary main CI must
  # not overwrite the signed production build.
  deploy-frontend:
    name: Deploy Frontend
    needs: [test, frontend-build]
    if: github.ref_name != 'main' && github.ref_name != 'sandbox'
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit

  scenario-build:
    name: Build scenario binaries
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-tests
      - name: Build exact checked-out service and runner binaries
        env:
          BUILD_GIT_COMMIT_HASH: ${{ github.sha }}
        run: cargo build --locked --timings -p permesi -p genesis -p permesi-oauth-scenario
      # A tar archive preserves executable permissions through artifact transport.
      - name: Package scenario binaries
        run: |
          mkdir -p .tmp/scenario-binaries
          for binary in permesi genesis permesi-oauth-scenario; do
            objcopy --strip-debug "target/debug/${binary}" ".tmp/scenario-binaries/${binary}"
          done
          tar -czf .tmp/scenario-binaries.tar.gz -C .tmp/scenario-binaries permesi genesis permesi-oauth-scenario
          stat -c 'Scenario archive: %s bytes' .tmp/scenario-binaries.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scenario-binaries-${{ github.sha }}
          path: .tmp/scenario-binaries.tar.gz
          if-no-files-found: error
          overwrite: true

  oauth-scenarios:
    name: OAuth scenarios (${{ matrix.replicas }} replicas)
    needs: [frontend-build, scenario-build]
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    env:
      PERMESI_SCENARIO_EXPECTED_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      # Each topology runs several local PostgreSQL/OpenBao/service stacks, and the
      # harness starts two more stacks concurrently. A runner VM takes one job of this
      # repository at a time, so the two topologies run side by side on separate VMs.
      matrix:
        replicas: [3, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: apps/web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scenario-binaries-${{ github.sha }}
          path: .tmp/scenario-binaries
      - name: Unpack same-run scenario binaries
        run: |
          mkdir -p target/debug
          tar -xzf .tmp/scenario-binaries/scenario-binaries.tar.gz -C target/debug
      - name: Set up Node for the Better Auth fixture
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/better_auth_interop/package-lock.json
      - name: Install Just for OAuth recipe tests
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: just@1.58.0
          fallback: none
      - name: Ensure zsh for OAuth recipe tests
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
      - name: Install Better Auth fixture dependencies
        working-directory: tools/better_auth_interop
        run: npm ci
      - name: Check Better Auth fixture syntax
        working-directory: tools/better_auth_interop
        run: npm run check
      - name: Audit Better Auth fixture dependencies
        working-directory: tools/better_auth_interop
        run: npm audit --audit-level=high
      - uses: ./.github/actions/ensure-container-runtime
        env:
          PERMESI_TEST_REQUIRE_PODMAN: '1'
      - name: Run all real OAuth scenarios
        run: target/debug/permesi-oauth-scenario --replicas ${{ matrix.replicas }} --suite full --access-token-ttl-seconds 10 --report-dir .tmp/oauth-scenario-ci
      - name: Verify recovery ownership guards
        run: python3 -m unittest discover -s tools/oauth_scenario/tests -p '*_test.py'
      - name: Verify harness cleanup and isolation
        run: python3 tools/oauth_scenario/tests/harness.py --replicas ${{ matrix.replicas }}
      - name: Upload sanitized scenario reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oauth-scenario-reports-${{ matrix.replicas }}-replicas
          path: |
            .tmp/oauth-scenario-ci/**/report.json
            .tmp/oauth-scenario-ci/**/junit.xml
            .tmp/oauth-scenario-ci/**/ownership-*.json
          if-no-files-found: warn

  browser-tests:
    name: Browser tests
    needs: [frontend-build]
    # Use a fresh host for browser profiles and the preinstalled Chromium-compatible browser.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: apps/web/dist
      - uses: ./.github/actions/ensure-container-runtime
        env:
          PERMESI_TEST_REQUIRE_PODMAN: '1'
      - name: Install browser test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh
          cargo install just --locked --version 1.58.0
      - uses: ./.github/actions/ensure-browser-runtime
      - name: Run console and real PostgreSQL browser tests
        run: just web-test-browser-built

  sandbox-images:
    name: Build local OCI candidates
    needs: [build, frontend-build]
    if: github.ref_name == 'sandbox'
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check qualification handoff ordering
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/handoff-deps" PyYAML==6.0.3
          PYTHONPATH="$RUNNER_TEMP/handoff-deps" python3 scripts/test-sandbox-qualification.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-binaries
          path: dist-bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: apps/web/dist
      - name: Archive candidate images
        run: |
          set -euo pipefail
          chmod +x dist-bin/{permesi,genesis}
          mkdir candidates
          for service in permesi genesis web; do
            file="services/$service/Dockerfile"
            if [[ "$service" == web ]]; then file=apps/web/Dockerfile; fi
            image="localhost/permesi-candidate/$service:$GITHUB_SHA"
            podman build --format oci -f "$file" -t "$image" .
            podman save --format oci-archive -o "candidates/$service.tar" "$image"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: archive
        with:
          name: sandbox-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: candidates/*.tar
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package GHCR
    needs: [test, build, frontend-build]
    if: github.ref_name == 'develop'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      packages: write
    outputs:
      permesi_digest: ${{ steps.push.outputs.permesi_digest }}
      genesis_digest: ${{ steps.push.outputs.genesis_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/ensure-container-runtime

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ${CONTAINER_TOOL} login ghcr.io -u "${{ github.actor }}"
          --password-stdin

      - name: Download Frontend Dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: apps/web/dist

      - name: Verify Frontend Dist layout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d apps/web/dist/dist && ! -f apps/web/dist/index.html ]]; then
            shopt -s dotglob
            mv apps/web/dist/dist/* apps/web/dist/
            rmdir apps/web/dist/dist
          fi
          test -f apps/web/dist/index.html

      - name: Download image binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-binaries
          path: dist-bin

      # Each digest is the one the push itself reports, so the qualification below runs
      # against the image built from this commit. Reading it back by pulling `:develop`
      # could name an image another run pushed in between.
      - name: Build & Push images
        id: push
        shell: bash
        run: |-
          set -euo pipefail
          test -s dist-bin/permesi && test -s dist-bin/genesis
          # Push one reference and print the digest the registry stored for it.
          push_for_digest() {
            local reference="$1" repository="${1%%:*}" digest="" digest_file
            if ${CONTAINER_TOOL} push --help 2>&1 | grep -q -- '--digestfile'; then
              digest_file="$(mktemp)"
              ${CONTAINER_TOOL} push --digestfile "${digest_file}" "${reference}" >&2
              digest="$(tr -d '[:space:]' < "${digest_file}")"
              rm -f "${digest_file}"
            else
              ${CONTAINER_TOOL} push "${reference}" >&2
              digest="$(${CONTAINER_TOOL} image inspect "${reference}" --format '{{join .RepoDigests "\n"}}' \
                | awk -F@ -v repository="${repository}" '$1 == repository { print $2; exit }')"
            fi
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "The push of ${reference} reported no digest." >&2
              return 1
            fi
            printf '%s\n' "${digest}"
          }
          for service in permesi genesis web; do
            image="ghcr.io/permesi/${service}"
            dockerfile="services/${service}/Dockerfile"
            if [[ "${service}" == "web" ]]; then
              dockerfile="apps/web/Dockerfile"
            fi
            ${CONTAINER_TOOL} build \
              -f "${dockerfile}" \
              -t "${image}:develop" \
              .
            # Assigned first: a failed push must fail the step, not write an empty output.
            digest="$(push_for_digest "${image}:develop")"
            echo "${service}_digest=${digest}" >> "$GITHUB_OUTPUT"
          done

  # Start the release's image qualification against the `:develop` images just pushed, so
  # the path a release depends on is exercised on every develop push and not only on
  # release day. It is dispatched as a run of its own: it takes about 25 minutes on
  # hosted runners, and a failure there shows as a failed `Qualify published images` run
  # without changing the result of this workflow, which `just release` waits for before
  # it moves `main`. The digests are checked here because they become workflow inputs.
  qualify-develop:
    name: Start qualification of the develop images
    needs: [package]
    if: github.repository == 'permesi/permesi' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Qualify published images
        env:
          GH_TOKEN: ${{ github.token }}
          PERMESI_DIGEST: ${{ needs.package.outputs.permesi_digest }}
          GENESIS_DIGEST: ${{ needs.package.outputs.genesis_digest }}
          WEB_DIGEST: ${{ needs.package.outputs.web_digest }}
        run: |
          set -euo pipefail
          for digest in "$PERMESI_DIGEST" "$GENESIS_DIGEST" "$WEB_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::a develop image has no digest"; exit 1; }
          done
          gh workflow run release-qualify.yml --repo "$GITHUB_REPOSITORY" --ref develop \
            -f app_sha="$GITHUB_SHA" -f permesi_digest="$PERMESI_DIGEST" \
            -f genesis_digest="$GENESIS_DIGEST" -f web_digest="$WEB_DIGEST"

  # One aggregate check for branch protection and the release flow: it passes only
  # when every test and build job succeeded, so the required check never depends on
  # job or matrix names. Coverage and the deploy/package side effects are not gates.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - build
      - frontend-build
      - scenario-build
      - oauth-scenarios
      - browser-tests
      - sandbox-images
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ format('{0} {1} {2} {3} {4} {5}', needs.test.result, needs.build.result, needs.frontend-build.result, needs.scenario-build.result, needs.oauth-scenarios.result, needs.browser-tests.result) }}
          CANDIDATES: ${{ needs.sandbox-images.result }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/sandbox && "$CANDIDATES" != success ]]; then exit 1; fi
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done

  # Chart qualification takes about 50 minutes, so it starts as soon as the candidate
  # images exist and runs alongside the tests. Its result only counts through
  # `containment-record`, which also needs `CI OK` and coverage.
  containment:
    if: github.repository == 'permesi/permesi' && github.ref == 'refs/heads/sandbox'
    needs: [sandbox-images]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/containment.yml
    with:
      artifact_id: ${{ needs.sandbox-images.outputs.artifact_id }}
      artifact_digest: ${{ needs.sandbox-images.outputs.artifact_digest }}

  # The release guard reads this status. It is written only when every gate of this run
  # passed and both sandbox branches still point at the qualified pair; the chart
  # revision was resolved when qualification started, so a chart push since then leaves
  # this run unrecorded and the chart repository's own containment qualifies the new pair.
  containment-record:
    name: containment / record
    if: github.repository == 'permesi/permesi' && github.ref == 'refs/heads/sandbox'
    needs: [ci-ok, coverage, containment]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record the successful pair on the triggering commit
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SHA: ${{ needs.containment.outputs.app_sha }}
          HELM_SHA: ${{ needs.containment.outputs.helm_sha }}
          ARTIFACT_ID: ${{ needs.containment.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$APP_SHA" == "$GITHUB_SHA" && "$HELM_SHA" =~ ^[0-9a-f]{40}$ && "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$(gh api repos/permesi/permesi/git/ref/heads/sandbox --jq .object.sha)" == "$APP_SHA" ]]
          [[ "$(gh api repos/permesi/permesi-helm/git/ref/heads/sandbox --jq .object.sha)" == "$HELM_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context="containment/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            -f description="Helm $HELM_SHA, OCI artifact $ARTIFACT_ID" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" >/dev/null
