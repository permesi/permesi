---
name: Dispatch Helm Release

on:
  workflow_call:
    inputs:
      version:
        description: Release tag to dispatch (X.Y.Z or vX.Y.Z)
        required: true
        type: string
      source_sha:
        description: Commit the release was built from; defaults to the run's commit.
        required: false
        default: ''
        type: string
      permesi_digest:
        description: Published GHCR digest for ghcr.io/permesi/permesi.
        required: false
        default: ''
        type: string
      genesis_digest:
        description: Published GHCR digest for ghcr.io/permesi/genesis.
        required: false
        default: ''
        type: string
      web_digest:
        description: Published GHCR digest for ghcr.io/permesi/web.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to dispatch (X.Y.Z or vX.Y.Z)
        required: true
        type: string
      source_sha:
        description: Commit the release was built from; defaults to the run's commit.
        required: false
        default: ''
        type: string
      permesi_digest:
        description: Published GHCR digest for ghcr.io/permesi/permesi.
        required: false
        default: ''
        type: string
      genesis_digest:
        description: Published GHCR digest for ghcr.io/permesi/genesis.
        required: false
        default: ''
        type: string
      web_digest:
        description: Published GHCR digest for ghcr.io/permesi/web.
        required: false
        default: ''
        type: string

concurrency:
  group: dispatch-helm-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify permesi-helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dispatch release to permesi-helm
        uses: ./.github/actions/dispatch-helm
        with:
          version: ${{ inputs.version }}
          source_sha: ${{ inputs.source_sha || github.sha }}
          permesi_digest: ${{ inputs.permesi_digest }}
          genesis_digest: ${{ inputs.genesis_digest }}
          web_digest: ${{ inputs.web_digest }}
          app_id: ${{ vars.PERMESI_HELM_APP_ID }}
          private_key: ${{ secrets.PERMESI_HELM_APP_PRIVATE_KEY }}
