name: Dispatch Helm release
description: >-
  Notify permesi-helm of a release: validate the version, the source commit and the
  image digests, then send a `permesi-release` repository dispatch with them. Used by the
  Deploy workflow (after checking the release is the latest) and by the manual
  Dispatch Helm Release workflow.
inputs:
  version:
    description: Release tag (X.Y.Z or vX.Y.Z).
    required: true
  source_sha:
    description: Commit the release was built from.
    required: true
  permesi_digest:
    description: Digest of ghcr.io/permesi/permesi for this release.
    required: false
    default: ''
  genesis_digest:
    description: Digest of ghcr.io/permesi/genesis for this release.
    required: false
    default: ''
  web_digest:
    description: Digest of ghcr.io/permesi/web for this release.
    required: false
    default: ''
  app_id:
    description: GitHub App id allowed to dispatch to permesi-helm.
    required: true
  private_key:
    description: That GitHub App's private key.
    required: true
runs:
  using: composite
  steps:
    - name: Resolve release metadata
      id: meta
      shell: bash
      env:
        RAW_VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        PERMESI_DIGEST: ${{ inputs.permesi_digest }}
        GENESIS_DIGEST: ${{ inputs.genesis_digest }}
        WEB_DIGEST: ${{ inputs.web_digest }}
      run: |
        set -euo pipefail
        version="${RAW_VERSION#v}"
        if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Unsupported release tag '${RAW_VERSION}'. Expected X.Y.Z or vX.Y.Z." >&2
          exit 1
        fi
        for digest in "${PERMESI_DIGEST}" "${GENESIS_DIGEST}" "${WEB_DIGEST}"; do
          if [[ -n "${digest}" && ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid digest '${digest}'." >&2
            exit 1
          fi
        done
        if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Invalid source commit '${SOURCE_SHA}'." >&2
          exit 1
        fi
        {
          echo "version=${version}"
          echo "source_tag=${RAW_VERSION}"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ github.repository_owner }}
        repositories: permesi-helm

    - name: Dispatch release to permesi-helm
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
        VERSION: ${{ steps.meta.outputs.version }}
        SOURCE_TAG: ${{ steps.meta.outputs.source_tag }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        PERMESI_DIGEST: ${{ inputs.permesi_digest }}
        GENESIS_DIGEST: ${{ inputs.genesis_digest }}
        WEB_DIGEST: ${{ inputs.web_digest }}
      run: |
        set -euo pipefail
        jq -n \
          --arg version "${VERSION}" \
          --arg repo "${GITHUB_REPOSITORY}" \
          --arg sha "${SOURCE_SHA}" \
          --arg tag "${SOURCE_TAG}" \
          --arg permesi "${PERMESI_DIGEST}" \
          --arg genesis "${GENESIS_DIGEST}" \
          --arg web "${WEB_DIGEST}" \
          '{
            event_type: "permesi-release",
            client_payload: {
              version: $version,
              source_repo: $repo,
              source_sha: $sha,
              source_tag: $tag,
              images: {
                permesi: {repository: "ghcr.io/permesi/permesi", tag: $version, digest: $permesi},
                genesis: {repository: "ghcr.io/permesi/genesis", tag: $version, digest: $genesis},
                web: {repository: "ghcr.io/permesi/web", tag: $version, digest: $web}
              }
            }
          }' > "${RUNNER_TEMP}/helm-payload.json"
        cat "${RUNNER_TEMP}/helm-payload.json"
        curl -fsSL \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/permesi/permesi-helm/dispatches \
          --data @"${RUNNER_TEMP}/helm-payload.json"
