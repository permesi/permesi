name: Release is latest
description: >-
  Whether a tag is the highest X.Y.Z release tag right now. Production steps (the
  `latest` image tag, Cloudflare Pages, Helm, the docs) call it immediately before they
  act, so a re-run job of an older release never rolls production back. It fails when
  GitHub cannot be asked, instead of treating that as "no releases".
inputs:
  tag:
    description: The X.Y.Z tag being published.
    required: true
  token:
    description: A token that can read the repository.
    required: true
outputs:
  latest:
    description: "'true' when the tag is the highest release, otherwise 'false'."
    value: ${{ steps.check.outputs.latest }}
  highest:
    description: The highest release tag (empty when there is none).
    value: ${{ steps.check.outputs.highest }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # A plain assignment, so a failing listing fails the step instead of looking
        # like "no releases".
        tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name')"
        highest="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"${tags}" | sort -V | tail -n 1 || true)"
        latest=false
        if [[ -n "${highest}" && "${highest}" == "${TAG}" ]]; then
          latest=true
        fi
        {
          echo "latest=${latest}"
          echo "highest=${highest}"
        } >> "$GITHUB_OUTPUT"
        echo "Highest release: ${highest:-none}; ${TAG} is the latest: ${latest}."
