version: 2
# Dependabot proposes updates as pull requests into sandbox, where work lands; from there
# they reach develop and a release like any other change. main only ever holds released
# commits, so no update targets it. Action updates arrive as one weekly pull request.
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "sandbox"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Watch authentication parent libraries, including the temporary OPAQUE Git pin.
  # Keep RSA's digest compatibility dependency under manual control.
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "sandbox"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "opaque-ke"
      - dependency-name: "webauthn-rs"
      - dependency-name: "webauthn-rs-proto"
      - dependency-name: "openidconnect"
    groups:
      authentication-libraries:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Base images are pinned by digest; Dependabot rewrites tag and digest together.
  - package-ecosystem: "docker"
    directories:
      - "/services/permesi"
      - "/services/genesis"
      - "/apps/web"
    target-branch: "sandbox"
    schedule:
      interval: "weekly"
    groups:
      container-base-images:
        patterns:
          - "*"
    open-pull-requests-limit: 3
